# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: emerald

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: 'research university'
    description: 'Alessandro Suglia is a Lecturer (Assistant Professor) in Embodied Natural Language Processing at the School of Informatics, University of Edinburgh, researching multimodal generative AI for embodied and situated human-robot interaction, with research collaborations including Amazon Alexa AI, Meta AI, and the European Space Agency.'
  org_name: 'School of Informatics, University of Edinburgh'
  twitter: 'ale_suglia'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: 'alesuglia.github.io'
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: false
    show_theme_chooser: true
    logo:
      text: "Alessandro Suglia"

# Site footer
footer:
  copyright:
    notice: '© {year} Alessandro Suglia. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
